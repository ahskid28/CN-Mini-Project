name: All C build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: c-project-linux
          path: |
            cnproxy
            origin
            test_proxy
            cnbenchmark
            benchmark-results.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          foreach ($item in @(@('src/proxy.c','cnproxy'), @('tests/origin.c','origin'), @('tests/test_proxy.c','test_proxy'), @('tests/benchmark.c','cnbenchmark'))) {
            gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic $item[0] -o ($item[1] + '.exe') -lws2_32
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: ./test_proxy.exe ./cnproxy.exe ./origin.exe
      - run: ./cnbenchmark.exe ./cnproxy.exe ./origin.exe benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: c-project-windows
          path: |
            *.exe
            benchmark-results.json

